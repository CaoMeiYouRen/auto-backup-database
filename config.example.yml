# 数据库自动备份配置示例
# 复制此文件为 config.yml 并根据实际情况修改

oss:
  region: "${OSS_REGION}"
  accessKeyId: "${OSS_ACCESS_KEY_ID}"
  accessKeySecret: "${OSS_ACCESS_KEY_SECRET}"
  bucket: "${OSS_BUCKET}"
  endpoint: "${OSS_ENDPOINT}"

security:
  backupPassword: "${BACKUP_PASSWORD}"

projects:
  - name: my-app-db
    dbType: sqlite
    dbPath: "/data/apps/my-app/*.db" # 支持 Glob 语法
    backupSchedule: "0 2 * * *" # 每天凌晨 2 点
    compress:
      enabled: true
      password: true # 使用环境变量中的 BACKUP_PASSWORD 加密
    retention:
      local:
        days: 7
        maxSize: 2GB
      remote:
        days: 30
        maxSize: 10GB
    options:
      localEnabled: true
      remoteEnabled: true

  - name: mongo-prod
    dbType: mongodb
    connection:
      uri: "${MONGODB_URI}"
      database: "${MONGODB_DATABASE:-app}"
    dumpOptions:
      archive: true
      authenticationDatabase: "${MONGODB_AUTH_DB:-admin}"
      extraArgs: []
    backupSchedule: "0 3 * * *"
    compress:
      enabled: true
      password: true
    retention:
      local:
        days: 7
        maxSize: 5GB
      remote:
        days: 30
        maxSize: 20GB
    options:
      localEnabled: true
      remoteEnabled: true

  - name: mysql-prod
    dbType: mysql
    connection:
      uri: "${MYSQL_URI}"
      database: "${MYSQL_DATABASE:-app}"
    dumpOptions:
      singleTransaction: true
      quick: true
      routines: true
      events: true
      extraArgs: []
    backupSchedule: "0 3 * * *"
    compress:
      enabled: true
      password: true
    retention:
      local:
        days: 7
        maxSize: 5GB
      remote:
        days: 30
        maxSize: 20GB
    options:
      localEnabled: true
      remoteEnabled: true

  - name: postgres-prod
    dbType: postgresql
    connection:
      uri: "${POSTGRESQL_URI}"
      database: "${POSTGRESQL_DATABASE:-app}"
    dumpOptions:
      format: custom
      compression: 0
      extraArgs: []
    backupSchedule: "0 4 * * *"
    compress:
      enabled: true
      password: true
    retention:
      local:
        days: 7
        maxSize: 5GB
      remote:
        days: 30
        maxSize: 20GB
    options:
      localEnabled: true
      remoteEnabled: true

  - name: postgres-all
    dbType: postgresql
    connection:
      uri: "${POSTGRESQL_URI}" # 全库备份时连接串中的数据库名会被 pg_dumpall 忽略
    dumpOptions:
      allDatabases: true # 使用 pg_dumpall 导出全部数据库（需 superuser 权限，仅支持 plain SQL 输出）
      extraArgs: ["--no-role-passwords"]
    backupSchedule: "0 4 * * *"
    compress:
      enabled: true # 全库备份不支持内置压缩，由外层压缩兜底
      password: true
    retention:
      local:
        days: 7
        maxSize: 10GB
      remote:
        days: 30
        maxSize: 50GB
    options:
      localEnabled: true
      remoteEnabled: true

  - name: my-files
    dbType: file # 通用备份模式：直接备份指定的文件或文件夹
    paths: # 支持 Glob 语法，可混合文件和目录
      - "/data/apps/my-app/config"
      - "/data/archives/*.zip"
    backupSchedule: "0 1 * * *"
    compress:
      enabled: true
      password: true
      skipExtensions: [".zip", ".tar.gz"] # 已压缩文件扩展名白名单（可选，默认内置常见压缩格式）
    retention:
      local:
        days: 7
        maxSize: 2GB
      remote:
        days: 30
        maxSize: 10GB
    options:
      localEnabled: true
      remoteEnabled: true

# 通知配置（可选）
notify:
  enabled: true
  type: Dingtalk # 支持多种推送方式，详见 push-all-in-one
  config:
    DINGTALK_ACCESS_TOKEN: "${DINGTALK_ACCESS_TOKEN}"
    DINGTALK_SECRET: "${DINGTALK_SECRET}"
  option:
    msgtype: markdown
